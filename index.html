<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuji Flip - Premium Head or Tails</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: white;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .coin-container {
            perspective: 1000px;
            width: 140px;
            height: 140px;
            margin: 1.5rem auto;
        }

        #coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            backface-visibility: hidden;
            border: 4px solid #fbbf24;
        }

        .heads {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #451a03;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 0 30px rgba(251, 191, 36, 0.4);
        }

        .tails {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #451a03;
            transform: rotateY(180deg);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2), 0 0 30px rgba(180, 83, 9, 0.4);
        }

        .flipping-heads { transform: rotateY(1800deg); }
        .flipping-tails { transform: rotateY(1980deg); }

        .btn-grad {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s ease;
        }
        .btn-grad:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.5);
        }

        .recent-item {
            animation: slideIn 0.3s ease-out;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 flex items-center justify-center">

    <div class="max-w-md w-full glass rounded-[2.5rem] overflow-hidden">
        <!-- Top Bar / Logout -->
        <div id="topBar" class="hidden px-6 pt-6 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Account</span>
                <span id="accountMini" class="text-xs font-mono text-indigo-300">0x...</span>
            </div>
            <button onclick="logout()" class="text-[10px] bg-white/5 hover:bg-red-500/20 hover:text-red-400 transition-colors px-3 py-1.5 rounded-full border border-white/10 uppercase font-bold tracking-tighter">
                Logout
            </button>
        </div>

        <div class="p-8 pt-4 space-y-6">
            <!-- Header -->
            <div class="text-center space-y-1">
                <h1 class="text-4xl font-extrabold tracking-tighter italic">
                    <span class="text-white">FUJI</span><span class="text-indigo-500">FLIP</span>
                </h1>
                <div id="pnlBadge" class="inline-flex items-center px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 text-[10px] font-bold border border-emerald-500/20">
                    PnL: +$0.00
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Your USDC</p>
                    <p id="userBalance" class="text-xl font-bold tracking-tight">0.00</p>
                </div>
                <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">House</p>
                    <p id="houseBalance" class="text-xl font-bold tracking-tight">0.00</p>
                </div>
            </div>

            <!-- Coin -->
            <div class="coin-container">
                <div id="coin">
                    <div class="side heads">H</div>
                    <div class="side tails">T</div>
                </div>
            </div>

            <!-- Interaction Area -->
            <div id="loginView" class="py-4">
                <button id="connectBtn" class="btn-grad w-full py-4 rounded-2xl font-bold text-lg shadow-xl">
                    Connect Wallet
                </button>
            </div>

            <div id="gameView" class="hidden space-y-5">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <span class="text-slate-500 font-bold text-sm">$</span>
                    </div>
                    <input type="number" id="betAmount" value="5" min="1"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-8 pr-4 text-xl font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all">
                </div>

                <div class="flex gap-3">
                    <button onclick="play(true)" id="headsBtn" class="flex-1 bg-white/5 hover:bg-yellow-500/10 border border-white/10 hover:border-yellow-500/50 py-4 rounded-2xl font-bold transition-all">
                        HEADS
                    </button>
                    <button onclick="play(false)" id="tailsBtn" class="flex-1 bg-white/5 hover:bg-orange-500/10 border border-white/10 hover:border-orange-500/50 py-4 rounded-2xl font-bold transition-all">
                        TAILS
                    </button>
                </div>
            </div>

            <!-- Status -->
            <div id="status" class="text-center text-xs font-semibold text-slate-400 h-4">Connect to start playing</div>

            <!-- Recents -->
            <div class="pt-2">
                <h3 class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-3 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                    Recent Activity
                </h3>
                <div id="recentList" class="space-y-2 max-h-32 overflow-y-auto pr-2 text-[11px]">
                    <div class="text-center text-slate-600 py-4 italic">No games yet...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONTRACT_ADDRESS = "0x26fa6Ec43d17D0D31FBee5fb3167229322116687";
        const USDC_ADDRESS = "0x5425890298aed601595a70AB815c96711a31Bc65";
        const FUJI_CHAIN_ID = "0xa869";

        let provider, signer, contract, usdcContract;
        let totalPnL = 0;

        const abi = [
            "function flipCoin(uint256 _amount, bool _choice) external",
            "function getContractBalance() external view returns (uint256)",
            "event BetPlaced(address indexed player, uint256 amount, bool choice, bool won)"
        ];
        const usdcAbi = [
            "function balanceOf(address account) external view returns (uint256)",
            "function allowance(address owner, address spender) external view returns (uint256)",
            "function approve(address spender, uint256 amount) external returns (bool)"
        ];

        async function init() {
            if (window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                document.getElementById('connectBtn').addEventListener('click', connect);
                
                // Check if already connected
                const accounts = await provider.listAccounts();
                if (accounts.length > 0) connect();
            }
        }

        async function connect() {
            try {
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== FUJI_CHAIN_ID) {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: FUJI_CHAIN_ID }],
                    });
                }

                const accounts = await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                
                contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
                usdcContract = new ethers.Contract(USDC_ADDRESS, usdcAbi, signer);

                // UI Swap
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('gameView').classList.remove('hidden');
                document.getElementById('topBar').classList.remove('hidden');
                document.getElementById('accountMini').innerText = `${accounts[0].substring(0,6)}...${accounts[0].substring(38)}`;
                
                updateBalances();
                fetchHistory();
                showStatus("Ready for action");
            } catch (err) {
                showStatus("Connection failed");
            }
        }

        function logout() {
            signer = null;
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('gameView').classList.add('hidden');
            document.getElementById('topBar').classList.add('hidden');
            showStatus("Disconnected");
        }

        async function updateBalances() {
            if (!signer) return;
            try {
                const addr = await signer.getAddress();
                const uBal = await usdcContract.balanceOf(addr);
                const hBal = await usdcContract.balanceOf(CONTRACT_ADDRESS);
                document.getElementById('userBalance').innerText = parseFloat(ethers.formatUnits(uBal, 6)).toFixed(2);
                document.getElementById('houseBalance').innerText = parseFloat(ethers.formatUnits(hBal, 6)).toFixed(2);
            } catch (e) {}
        }

        async function fetchHistory() {
            try {
                // Get events from the last 1000 blocks
                const filter = contract.filters.BetPlaced();
                const events = await contract.queryFilter(filter, -1000);
                const list = document.getElementById('recentList');
                list.innerHTML = '';
                
                events.reverse().slice(0, 10).forEach(ev => addHistoryItem(ev.args));
            } catch (e) {
                console.error("History error", e);
            }
        }

        function addHistoryItem(args) {
            const list = document.getElementById('recentList');
            const item = document.createElement('div');
            item.className = 'recent-item flex justify-between items-center py-2';
            
            const amt = ethers.formatUnits(args.amount, 6);
            const side = args.choice ? "Heads" : "Tails";
            const won = args.won;
            
            item.innerHTML = `
                <div class="flex flex-col">
                    <span class="text-white font-semibold">${args.player.substring(0,6)}...</span>
                    <span class="text-slate-500">Bet ${side}</span>
                </div>
                <div class="text-right">
                    <span class="font-bold ${won ? 'text-emerald-400' : 'text-rose-400'}">
                        ${won ? '+' : '-'}$${amt}
                    </span>
                </div>
            `;
            list.prepend(item);
        }

        async function play(choice) {
            if (!signer) return connect();
            
            const inputVal = document.getElementById('betAmount').value;
            const amount = ethers.parseUnits(inputVal, 6);
            
            try {
                setLoading(true);
                showStatus("Authorizing...");
                
                const addr = await signer.getAddress();
                const allowance = await usdcContract.allowance(addr, CONTRACT_ADDRESS);
                
                if (allowance < amount) {
                    const tx = await usdcContract.approve(CONTRACT_ADDRESS, ethers.MaxUint256);
                    await tx.wait();
                }

                showStatus("Flipping coin...");
                const tx = await contract.flipCoin(amount, choice);
                
                // Generic spin start
                const coin = document.getElementById('coin');
                coin.style.transition = "transform 3s cubic-bezier(0.4, 0, 0.2, 1)";
                
                const receipt = await tx.wait();
                
                const iface = new ethers.Interface(abi);
                let won = false;
                receipt.logs.forEach(log => {
                    try {
                        const parsed = iface.parseLog(log);
                        if (parsed.name === "BetPlaced") {
                            won = parsed.args.won;
                            addHistoryItem(parsed.args);
                        }
                    } catch (e) {}
                });

                const resultIsHeads = (choice === won);
                coin.className = '';
                void coin.offsetWidth;
                coin.classList.add(resultIsHeads ? 'flipping-heads' : 'flipping-tails');

                // Update PnL
                const val = parseFloat(inputVal);
                totalPnL += won ? val : -val;
                const pnlEl = document.getElementById('pnlBadge');
                pnlEl.innerText = `PnL: ${totalPnL >= 0 ? '+' : ''}$${totalPnL.toFixed(2)}`;
                pnlEl.className = `inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border ${totalPnL >= 0 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'}`;

                setTimeout(() => {
                    showStatus(won ? "WINNER!" : "Bust...");
                    updateBalances();
                    setLoading(false);
                }, 3000);

            } catch (err) {
                showStatus("Try again");
                setLoading(false);
            }
        }

        function showStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        function setLoading(loading) {
            document.getElementById('headsBtn').disabled = loading;
            document.getElementById('tailsBtn').disabled = loading;
            document.getElementById('betAmount').disabled = loading;
        }

        init();
    </script>
</body>
</html>
