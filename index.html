<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuji Flip - Head or Tails</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Space+Grotesk', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 3D Coin Styling */
        .coin-container {
            perspective: 1000px;
            width: 160px;
            height: 160px;
            margin: 2rem auto;
        }

        #coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            backface-visibility: hidden;
            border: 6px solid #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        .heads {
            background: linear-gradient(45deg, #f59e0b, #fbbf24);
            color: #451a03;
        }

        .tails {
            background: linear-gradient(45deg, #78350f, #f59e0b);
            color: #451a03;
            transform: rotateY(180deg);
        }

        /* Animation classes */
        .flipping-heads { transform: rotateY(1800deg); } /* 5 full spins + land on heads */
        .flipping-tails { transform: rotateY(1980deg); } /* 5.5 spins + land on tails */

        .btn-primary {
            background: linear-gradient(to right, #6366f1, #a855f7);
            transition: all 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(168, 85, 247, 0.4);
        }
        .btn-primary:active { transform: translateY(0); }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-md w-full glass rounded-3xl p-8 space-y-6">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-orange-500">
                FUJI FLIP
            </h1>
            <p class="text-slate-400 text-sm mt-1">Double your USDC on Avalanche Fuji</p>
        </div>

        <!-- Connection State -->
        <div id="connectionBox" class="text-center py-2">
            <button id="connectBtn" class="btn-primary w-full py-3 rounded-xl font-bold">
                Connect Wallet
            </button>
            <p id="accountDisplay" class="hidden text-xs text-slate-400 mt-2 truncate"></p>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
                <p class="text-xs text-slate-400 uppercase tracking-wider">Your USDC</p>
                <p id="userBalance" class="text-xl font-bold">0.00</p>
            </div>
            <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
                <p class="text-xs text-slate-400 uppercase tracking-wider">House Pool</p>
                <p id="houseBalance" class="text-xl font-bold">0.00</p>
            </div>
        </div>

        <!-- Coin Display -->
        <div class="coin-container">
            <div id="coin">
                <div class="side heads">H</div>
                <div class="side tails">T</div>
            </div>
        </div>

        <!-- Betting Controls -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-2 px-1">BET AMOUNT (USDC)</label>
                <input type="number" id="betAmount" value="1" min="1" step="1" 
                    class="w-full bg-black/20 border border-white/10 rounded-xl py-3 px-4 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div class="flex gap-4">
                <button onclick="play(true)" id="headsBtn" class="flex-1 glass hover:bg-white/10 py-4 rounded-xl font-bold border-yellow-500/30">
                    HEADS
                </button>
                <button onclick="play(false)" id="tailsBtn" class="flex-1 glass hover:bg-white/10 py-4 rounded-xl font-bold border-amber-800/30">
                    TAILS
                </button>
            </div>
        </div>

        <!-- Status Message -->
        <div id="status" class="text-center text-sm font-medium h-6 text-indigo-400"></div>
    </div>

    <script>
        const CONTRACT_ADDRESS = "0x26fa6Ec43d17D0D31FBee5fb3167229322116687";
        const USDC_ADDRESS = "0x5425890298aed601595a70AB815c96711a31Bc65";
        const FUJI_CHAIN_ID = "0xa869"; // 43113

        let provider, signer, contract, usdcContract;
        const abi = [
            "function flipCoin(uint256 _amount, bool _choice) external",
            "function getContractBalance() external view returns (uint256)",
            "event BetPlaced(address indexed player, uint256 amount, bool choice, bool won)"
        ];
        const usdcAbi = [
            "function balanceOf(address account) external view returns (uint256)",
            "function allowance(address owner, address spender) external view returns (uint256)",
            "function approve(address spender, uint256 amount) external returns (bool)"
        ];

        async function init() {
            if (window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                document.getElementById('connectBtn').addEventListener('click', connect);
            } else {
                showStatus("Please install MetaMask!");
            }
        }

        async function connect() {
            try {
                // Check/Switch Network
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== FUJI_CHAIN_ID) {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: FUJI_CHAIN_ID }],
                    });
                }

                const accounts = await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                
                contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
                usdcContract = new ethers.Contract(USDC_ADDRESS, usdcAbi, signer);

                document.getElementById('connectBtn').classList.add('hidden');
                document.getElementById('accountDisplay').classList.remove('hidden');
                document.getElementById('accountDisplay').innerText = `Connected: ${accounts[0]}`;
                
                updateBalances();
                showStatus("Ready to flip!");
            } catch (err) {
                console.error(err);
                showStatus("Connection failed.");
            }
        }

        async function updateBalances() {
            if (!signer) return;
            try {
                const userAddr = await signer.getAddress();
                const userBal = await usdcContract.balanceOf(userAddr);
                const houseBal = await usdcContract.balanceOf(CONTRACT_ADDRESS);
                
                document.getElementById('userBalance').innerText = ethers.formatUnits(userBal, 6);
                document.getElementById('houseBalance').innerText = ethers.formatUnits(houseBal, 6);
            } catch (err) {
                console.error("Balance error:", err);
            }
        }

        async function play(choice) {
            if (!signer) return connect();
            
            const amountInput = document.getElementById('betAmount').value;
            const amount = ethers.parseUnits(amountInput, 6);
            
            try {
                setLoading(true);
                showStatus("Checking allowance...");
                
                // Check USDC Allowance
                const userAddr = await signer.getAddress();
                const allowance = await usdcContract.allowance(userAddr, CONTRACT_ADDRESS);
                
                if (allowance < amount) {
                    showStatus("Approving USDC...");
                    const tx = await usdcContract.approve(CONTRACT_ADDRESS, ethers.MaxUint256);
                    await tx.wait();
                }

                showStatus("Waiting for flip...");
                const tx = await contract.flipCoin(amount, choice);
                
                // Start generic animation while waiting for confirmation
                const coin = document.getElementById('coin');
                coin.style.transition = "transform 3s cubic-bezier(0.4, 0, 0.2, 1)";
                
                const receipt = await tx.wait();
                
                // Parse events to find result
                // Using Interface to parse the receipt logs
                const iface = new ethers.Interface(abi);
                let won = false;
                
                receipt.logs.forEach(log => {
                    try {
                        const parsed = iface.parseLog(log);
                        if (parsed.name === "BetPlaced") won = parsed.args.won;
                    } catch (e) {}
                });

                // Finalize Animation
                // If choice was Heads (true) and won, result was Heads.
                // If choice was Heads (true) and lost, result was Tails.
                const resultIsHeads = (choice === won);
                
                coin.className = ''; // reset
                void coin.offsetWidth; // trigger reflow
                coin.classList.add(resultIsHeads ? 'flipping-heads' : 'flipping-tails');

                setTimeout(() => {
                    showStatus(won ? "🎉 YOU WON!" : "💀 YOU LOST");
                    updateBalances();
                    setLoading(false);
                }, 3000);

            } catch (err) {
                console.error(err);
                showStatus("Transaction failed.");
                setLoading(false);
            }
        }

        function showStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        function setLoading(loading) {
            document.getElementById('headsBtn').disabled = loading;
            document.getElementById('tailsBtn').disabled = loading;
            document.getElementById('betAmount').disabled = loading;
        }

        init();
    </script>
</body>
</html>
