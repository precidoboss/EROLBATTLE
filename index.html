<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite Animation Tester</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #0f0f1a;
    --panel2: #141420;
    --border: #2a2a40;
    --border-bright: #4a4a70;
    --accent: #7c6af7;
    --accent2: #f7a06a;
    --text: #e8e8f0;
    --text-muted: #7070a0;
    --text-dim: #404060;
    --grid-col: #ffffff08;
    --green: #4affa0;
    --red: #ff6a6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-col) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-col) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 16px;
    min-height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: .15em;
    text-transform: uppercase;
    opacity: .8;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text);
  }

  .title span { color: var(--accent); }

  header .spacer { flex: 1; }

  .char-tabs {
    display: flex;
    gap: 4px;
  }

  .char-tab {
    padding: 7px 20px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
  }

  .char-tab:hover { border-color: var(--border-bright); color: var(--text); }
  .char-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Main layout */
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    align-items: start;
  }

  /* Sidebar anims */
  .sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: .15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .anim-list {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .anim-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 5px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .15s;
  }

  .anim-item:hover { background: var(--panel2); border-color: var(--border); }
  .anim-item.active {
    background: #7c6af715;
    border-color: var(--accent);
  }

  .anim-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background .15s;
  }

  .anim-item.active .anim-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .anim-name {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text);
    flex: 1;
  }

  .anim-item.active .anim-name { color: var(--accent); }

  .anim-frames {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
  }

  /* Stage area */
  .stage-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .stage {
    background: #111118;
    border: 1px solid var(--border);
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 340px;
    overflow: hidden;
    transition: background .3s;
  }

  .stage::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    box-shadow: inset 0 0 40px #00000060;
    pointer-events: none;
  }

  /* scanlines */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      #00000018 2px,
      #00000018 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  #canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    position: relative;
    z-index: 1;
  }

  .stage-label {
    position: absolute;
    top: 10px;
    left: 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #ffffff30;
    letter-spacing: .1em;
    text-transform: uppercase;
    z-index: 3;
  }

  .frame-counter {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    z-index: 3;
  }

  /* Controls panel */
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--text-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .ctrl-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    min-width: 48px;
  }

  input[type=range] {
    -webkit-appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    width: 100px;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent);
  }

  .play-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border: 1px solid var(--accent);
    border-radius: 5px;
    background: transparent;
    color: var(--accent);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .15s;
  }

  .play-btn:hover { background: var(--accent); color: #fff; }

  .step-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; justify-content: center;
  }

  .step-btn:hover { border-color: var(--border-bright); color: var(--text); }

  .divider { width: 1px; height: 28px; background: var(--border); }

  .scale-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .scale-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  .scale-btn:hover { border-color: var(--border-bright); color: var(--text); }

  /* BG picker */
  .bg-picks {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .bg-pick {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color .15s;
  }

  .bg-pick.active { border-color: var(--accent); }

  /* Loop toggle */
  .loop-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: transparent;
    color: var(--text-dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .15s;
  }

  .loop-btn.on {
    border-color: var(--green);
    color: var(--green);
  }

  /* Filmstrip */
  .filmstrip-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    overflow: hidden;
  }

  .strip-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .filmstrip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .filmstrip::-webkit-scrollbar { height: 3px; }
  .filmstrip::-webkit-scrollbar-track { background: transparent; }
  .filmstrip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .strip-frame {
    flex-shrink: 0;
    width: 52px; height: 52px;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: #08080f;
    transition: border-color .15s;
  }

  .strip-frame:hover { border-color: var(--border-bright); }
  .strip-frame.active { border-color: var(--accent); }

  .strip-frame canvas {
    width: 100%; height: 100%;
    image-rendering: pixelated;
  }

  .strip-num {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px;
    color: #ffffff50;
  }

  /* Loading */
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: .1em;
    z-index: 10;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .loading span { animation: blink 1s infinite; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="logo">// sprite tester v1.0</div>
      <div class="title">Sprite <span>Animator</span></div>
    </div>
    <div class="spacer"></div>
    <div class="char-tabs">
      <button class="char-tab active" onclick="selectChar('knight',this)">Knight</button>
      <button class="char-tab" onclick="selectChar('ninja',this)">Yellow Ninja</button>
    </div>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">Animations</div>
      <div class="anim-list" id="animList"></div>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="stage-label" id="stageLabel">IDLE</div>
        <div class="loading" id="loading"><span>LOADING...</span></div>
        <canvas id="canvas"></canvas>
        <div class="frame-counter" id="frameCounter">01 / 07</div>
      </div>

      <div class="controls">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
          <span id="playIcon">⏸</span> <span id="playText">Pause</span>
        </button>
        <button class="step-btn" onclick="stepFrame(-1)" title="Prev frame">◀</button>
        <button class="step-btn" onclick="stepFrame(1)" title="Next frame">▶</button>
        <button class="loop-btn on" id="loopBtn" onclick="toggleLoop()">↻ Loop</button>

        <div class="divider"></div>

        <div class="ctrl">
          <span class="ctrl-label">FPS</span>
          <input type="range" min="1" max="30" value="8" step="1" id="fpsSlider" oninput="setFps(this.value)">
          <span class="ctrl-val" id="fpsVal">8</span>
        </div>

        <div class="divider"></div>

        <div class="ctrl">
          <span class="ctrl-label">Scale</span>
          <div class="scale-wrap">
            <button class="scale-btn" onclick="changeScale(-1)">−</button>
            <span class="ctrl-val" id="scaleVal">2×</span>
            <button class="scale-btn" onclick="changeScale(1)">+</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="ctrl">
          <span class="ctrl-label">BG</span>
          <div class="bg-picks" id="bgPicks">
            <div class="bg-pick active" style="background:#0d0d18" onclick="setBg(this,'#0d0d18')"></div>
            <div class="bg-pick" style="background:#1a2a1a" onclick="setBg(this,'#1a2a1a')"></div>
            <div class="bg-pick" style="background:#2a1a1a" onclick="setBg(this,'#2a1a1a')"></div>
            <div class="bg-pick" style="background:#888" onclick="setBg(this,'#888')"></div>
            <div class="bg-pick" style="background:#ddd;border:1px solid #aaa" onclick="setBg(this,'#ddd')"></div>
            <div class="bg-pick" style="background:#fff;border:1px solid #aaa" onclick="setBg(this,'#fff')"></div>
          </div>
        </div>
      </div>

      <div class="filmstrip-wrap">
        <div class="strip-label">Filmstrip — click any frame</div>
        <div class="filmstrip" id="filmstrip"></div>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = 'https://raw.githubusercontent.com/precidoboss/adventurer/main/';

const CHARS = {
  knight: {
    frameW: 96, frameH: 83,
    anims: {
      Idle:    { file: 'KNIGHTIDLE.png',    frames: 7 },
      Walk:    { file: 'KNIGHTWALK.png',    frames: 8 },
      Run:     { file: 'KNIGHTRUN.png',     frames: 8 },
      Jump:    { file: 'KNIGHTJUMP.png',    frames: 5 },
      Attack1: { file: 'KNIGHTATTACK1.png', frames: 6 },
      Attack2: { file: 'KNIGHTATTACK2.png', frames: 5 },
      Attack3: { file: 'KNIGHTATTACK3.png', frames: 6 },
      Defend:  { file: 'KNIGHTDEFEND.png',  frames: 6 },
    }
  },
  ninja: {
    frameW: 128, frameH: 128,
    anims: {
      Idle:     { file: 'yellowNinja%20-%20idle.png',     frames: 8 },
      Walk:     { file: 'yellowNinja%20-%20walk.png',     frames: 10 },
      Attack:   { file: 'yellowNinja%20-%20attack.png',   frames: 20 },
      Death:    { file: 'yellowNinja%20-%20Death.png',    frames: 14 },
      Hit:      { file: 'yellowNinja%20-%20hit.png',      frames: 4 },
      Whitehit: { file: 'yellowNinja%20-%20Whitehit.png', frames: 4 },
    }
  }
};

let curChar = 'knight';
let curAnim = 'Idle';
let curFrame = 0;
let playing = true;
let looping = true;
let fps = 8;
let scale = 2;
let elapsed = 0;
let lastTime = 0;
let rafId;
const imgs = {};
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function imgKey(char, anim) { return char + '__' + anim; }

function loadImg(char, anim) {
  const key = imgKey(char, anim);
  if (imgs[key]) return imgs[key];
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = BASE + CHARS[char].anims[anim].file;
  img.onload = () => {
    if (curChar === char && curAnim === anim) {
      document.getElementById('loading').style.display = 'none';
      buildFilmstrip();
      draw();
    }
  };
  imgs[key] = img;
  return img;
}

function preloadAll() {
  Object.keys(CHARS).forEach(char =>
    Object.keys(CHARS[char].anims).forEach(anim => loadImg(char, anim))
  );
}

function selectChar(char, btn) {
  curChar = char;
  curAnim = Object.keys(CHARS[char].anims)[0];
  curFrame = 0;
  document.querySelectorAll('.char-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  resizeCanvas();
  buildSidebar();
  buildFilmstrip();
  showLoading();
}

function selectAnim(name) {
  curAnim = name;
  curFrame = 0;
  document.querySelectorAll('.anim-item').forEach(el => {
    el.classList.toggle('active', el.dataset.anim === name);
  });
  document.getElementById('stageLabel').textContent = name.toUpperCase();
  buildFilmstrip();
  const img = loadImg(curChar, curAnim);
  if (!img.complete) showLoading();
  else document.getElementById('loading').style.display = 'none';
}

function showLoading() {
  document.getElementById('loading').style.display = 'flex';
}

function buildSidebar() {
  const list = document.getElementById('animList');
  list.innerHTML = '';
  const cfg = CHARS[curChar];
  Object.entries(cfg.anims).forEach(([name, a]) => {
    const el = document.createElement('div');
    el.className = 'anim-item' + (name === curAnim ? ' active' : '');
    el.dataset.anim = name;
    el.innerHTML = `<div class="anim-dot"></div><div class="anim-name">${name}</div><div class="anim-frames">${a.frames}f</div>`;
    el.onclick = () => selectAnim(name);
    list.appendChild(el);
  });
}

function resizeCanvas() {
  const cfg = CHARS[curChar];
  canvas.width = cfg.frameW * scale;
  canvas.height = cfg.frameH * scale;
}

function draw() {
  const cfg = CHARS[curChar];
  const a = cfg.anims[curAnim];
  const img = imgs[imgKey(curChar, curAnim)];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!img || !img.complete || img.naturalWidth === 0) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img,
    curFrame * cfg.frameW, 0, cfg.frameW, cfg.frameH,
    0, 0, cfg.frameW * scale, cfg.frameH * scale
  );
  const total = a.frames;
  document.getElementById('frameCounter').textContent =
    String(curFrame + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
  highlightStrip(curFrame);
}

function buildFilmstrip() {
  const strip = document.getElementById('filmstrip');
  strip.innerHTML = '';
  const cfg = CHARS[curChar];
  const a = cfg.anims[curAnim];
  const img = imgs[imgKey(curChar, curAnim)];

  for (let i = 0; i < a.frames; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'strip-frame' + (i === curFrame ? ' active' : '');
    wrap.dataset.frame = i;

    const fc = document.createElement('canvas');
    fc.width = cfg.frameW;
    fc.height = cfg.frameH;
    const fctx = fc.getContext('2d');
    fctx.imageSmoothingEnabled = false;

    if (img && img.complete && img.naturalWidth > 0) {
      fctx.drawImage(img, i * cfg.frameW, 0, cfg.frameW, cfg.frameH, 0, 0, cfg.frameW, cfg.frameH);
    }

    const num = document.createElement('div');
    num.className = 'strip-num';
    num.textContent = i + 1;

    wrap.appendChild(fc);
    wrap.appendChild(num);
    wrap.onclick = () => { curFrame = i; draw(); highlightStrip(i); };
    strip.appendChild(wrap);
  }
}

function highlightStrip(f) {
  document.querySelectorAll('.strip-frame').forEach((el, i) => {
    el.classList.toggle('active', i === f);
  });
}

function loop(ts) {
  if (playing) {
    const dt = ts - lastTime;
    elapsed += dt;
    const interval = 1000 / fps;
    if (elapsed >= interval) {
      const cfg = CHARS[curChar];
      const a = cfg.anims[curAnim];
      elapsed %= interval;
      if (curFrame < a.frames - 1) {
        curFrame++;
      } else if (looping) {
        curFrame = 0;
      } else {
        playing = false;
        document.getElementById('playIcon').textContent = '▶';
        document.getElementById('playText').textContent = 'Play';
      }
      draw();
    }
  }
  lastTime = ts;
  rafId = requestAnimationFrame(loop);
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playIcon').textContent = playing ? '⏸' : '▶';
  document.getElementById('playText').textContent = playing ? 'Pause' : 'Play';
  if (playing) elapsed = 0;
}

function toggleLoop() {
  looping = !looping;
  const btn = document.getElementById('loopBtn');
  btn.classList.toggle('on', looping);
  btn.textContent = looping ? '↻ Loop' : '→ Once';
}

function stepFrame(dir) {
  const a = CHARS[curChar].anims[curAnim];
  curFrame = (curFrame + dir + a.frames) % a.frames;
  draw();
}

function setFps(v) {
  fps = parseInt(v);
  document.getElementById('fpsVal').textContent = fps;
}

function changeScale(d) {
  scale = Math.max(1, Math.min(6, scale + d));
  document.getElementById('scaleVal').textContent = scale + '×';
  resizeCanvas();
  draw();
}

function setBg(el, color) {
  document.getElementById('stage').style.background = color;
  document.querySelectorAll('.bg-pick').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// Init
resizeCanvas();
buildSidebar();
preloadAll();
loadImg(curChar, curAnim);
document.getElementById('stageLabel').textContent = curAnim.toUpperCase();

const firstImg = loadImg(curChar, curAnim);
if (firstImg.complete) {
  document.getElementById('loading').style.display = 'none';
  buildFilmstrip();
  draw();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
